.black:hover{transform:translateY(-1px) scale(1.01)}.black:active{transform:scale(.98)}

.ico{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid rgba(34,211,238,.6);outline-offset:2px}

.t3{position:relative;flex:none;display:flex;align-items:center;justify-content:center;border-radius:30%;background:linear-gradient(160deg,var(--a),var(--b));box-shadow:0 0 0 1px rgba(0,0,0,.10),inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 -4px 6px rgba(0,0,0,.16),0 10px 16px -6px var(--b)}

.t3 svg{position:relative;z-index:1;width:54%;height:54%;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.purp{--a:#a78bfa;--b:#7c3aed}.orng{--a:#fb923c;--b:#ea580c}

.brand{text-align:center;margin-bottom:30px}
.logo{width:76px;height:76px;margin:0 auto 18px;border-radius:30%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2b2d33,#000);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 3px 0 #98a1ab,0 14px 20px -6px rgba(0,0,0,.45),inset 0 1.5px 1px rgba(255,255,255,.6);position:relative}
.logo::after{content:"";position:absolute;left:6%;right:6%;top:4%;height:46%;border-radius:30% 30% 50% 50%/40% 40% 60% 60%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}

.role::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 26%,rgba(34,211,238,.09) 64%,rgba(255,255,255,.5) 100%);mix-blend-mode:soft-light}

.role:focus-visible{outline:3px solid rgba(34,211,238,.6);outline-offset:3px}
.role[aria-checked=true]{box-shadow:0 0 0 1px rgba(95,106,120,.5),0 0 0 3px #22d3ee,0 0 0 7px rgba(34,211,238,.2),0 14px 24px -10px rgba(8,145,178,.55),inset 0 0 0 1px rgba(255,255,255,.95),inset 0 2px 1px #fff,inset 0 0 20px rgba(255,255,255,.7)}
.role .t3{width:58px;height:58px}
.rt{flex:1;min-width:0;position:relative;z-index:1}

.spacer{flex:1;min-height:24px}
.cta{margin-top:22px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:9;max-width:calc(100% - 32px);padding:12px 18px;border-radius:20px;background:#0b1217;color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);transition:opacity .3s,transform .4s cubic-bezier(.3,1.4,.5,1)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.brand,.role,.cta,.sec{animation:rise .7s cubic-bezier(.2,.9,.3,1) both}

@media (max-width:380px){h1{font-size:30px}.rt span{font-size:13px}}

<script>
(function(){

roles.forEach(function(r){r.onclick=function(){

  go.disabled=false;goT.textContent=pick==='creator'?'Continue as Creator':'Continue as Brand';
}});
go.onclick=function(){
  if(!pick)return;
  try{localStorage.setItem('collancer_role',pick)}catch(e){}

function load(role){
  var f=document.getElementById('f-'+role);
  if(!f.dataset.ready){
    var t=document.getElementById('src-'+role).textContent.replace(/<\\!--/g,'<!--').replace(/<\\\/script/g,'</script');
    f.srcdoc=t;f.dataset.ready='1';
    if(role==='creator'&&location.hash==='#preview-booking')f.addEventListener('load',function(){try{f.contentWindow.postMessage('collancer:previewBooking','*')}catch(e){}});
  }
  return f;
}
function openApp(role){
  var f=load(role);
  ['creator','brand'].forEach(function(r){document.getElementById('f-'+r).hidden=(r!==role)});
  document.body.style.overflow='hidden';
  setTimeout(function(){try{f.contentWindow.focus()}catch(e){}},50);
}

  ['creator','brand'].forEach(function(r){document.getElementById('f-'+r).hidden=true});

}
